[package]
name = "ego-chat"
version = "0.2.1"
edition = "2024"
rust-version = "1.85"
description = "Portable launcher for durable Codex, ZCode, and ChatGPT review loops through Ego Browser"
readme = "README.md"
license = "MIT"
repository = "https://github.com/xicv/ego-chat"
keywords = ["codex", "zcode", "chatgpt", "mcp", "browser"]
categories = ["command-line-utilities", "development-tools"]
include = [
  "/Cargo.toml",
  "/Cargo.lock",
  "/LICENSE",
  "/rust/**",
  "/bin/*.mjs",
  "/src/*.mjs",
  "/skills/ego-chat/**",
  "/package.json",
  "/package-lock.json",
  "/README.md",
]

[[bin]]
name = "ego-chat"
path = "rust/main.rs"

[dependencies]
serde_json = { version = "1.0.151", features = ["preserve_order"] }
toml_edit = "0.25.13"
